name: Export Demucs

# Makes demucs/htdemucs.onnx from Meta's own checkpoint (tools/export_demucs.py),
# checks the separation against demucs itself, adds the "demucs" entry to
# sources.json the first time, writes index.json (tools/mirror.py) and
# commits the result to the branch that was pushed. Once the file's hash is
# pinned in sources.json, a run checks it and changes nothing.
on:
  push:
    branches: ["claude/**"]
    paths: ["tools/export_demucs.py", "tools/demucs_ref.py", "tools/demucs_spec.py", ".github/workflows/export-demucs.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Tools (pinned)
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          /tmp/venv/bin/pip install --quiet demucs==4.1.0 onnx==1.23.2 onnxruntime==1.32.0 numpy==2.5.5
      - run: /tmp/venv/bin/python tools/export_demucs.py
      - name: Add the sources.json entry (first run only)
        run: |
          python3 - <<'PY'
          import json
          p = "sources.json"
          s = json.load(open(p, encoding="utf-8"))
          if not any(e.get("dir") == "demucs" for e in s.get("local", [])):
              s.setdefault("local", []).append({
                  "dir": "demucs",
                  "files": ["htdemucs.onnx", "export.json"],
                  "source": "ONNX export of Meta's htdemucs checkpoint (hybrid_transformer/955717e8-8726e21a.th) by tools/export_demucs.py; demucs/export.json has the details and the check against demucs",
                  "licence": "MIT (demucs/LICENSE), (c) Meta Platforms, Inc. and affiliates",
              })
              with open(p, "w", encoding="utf-8") as f:
                  json.dump(s, f, indent=1, ensure_ascii=False)
                  f.write("\n")
          PY
      - run: python3 tools/mirror.py
      - run: python3 tools/mirror.py --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A demucs sources.json index.json
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Export Demucs htdemucs to ONNX (tools/export_demucs.py)"
          git push
